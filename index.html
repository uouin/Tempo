<title>翻页时钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
  }
  body {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /*
    兼容性策略（关键）：
    - CSS 里只用百分比和最基础的定位，不用 calc / CSS 变量 / vmin / flex gap
    - 卡片宽度、高度、字号、圆角、间距全部由 JS 按屏幕像素计算后内联写入
    - 数字居中：span 高度是窗口的 200%（= 整卡），flex 居中；
      下窗口的 span 用 top:-100%（百分比，相对窗口高度=整卡高）上移
  */
  .clock {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: row;
    flex-direction: row;
    -webkit-align-items: flex-end;   /* 秒卡与时/分卡底对齐 */
    align-items: flex-end;
  }
  .group {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: row;
    flex-direction: row;
    -webkit-align-items: center;
    align-items: center;
  }

  .card {
    position: relative;
    /* JS 会内联覆盖 width/height/font-size，这里给一个首帧兜底值 */
    width: 150px;
    height: 210px;
    font-size: 132px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    -webkit-flex: none;
    flex: none;
    /* 省电：把重绘/布局失效严格限制在卡片盒内，翻页时不再波及页面其他区域 */
    -webkit-contain: layout paint;
    contain: layout paint;
  }

  /* 静态上下两半（裁剪窗口） */
  .half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    background: -webkit-linear-gradient(top, #303036 0%, #1e1e22 100%);
    background: linear-gradient(180deg, #303036 0%, #1e1e22 100%);
    z-index: 1;
  }
  .half.upper {
    top: 0;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .half.lower {
    bottom: 0;
    background: -webkit-linear-gradient(top, #232327 0%, #1a1a1e 100%);
    background: linear-gradient(180deg, #232327 0%, #1a1a1e 100%);
    box-shadow: inset 0 1px 0 rgba(0,0,0,0.9);
  }

  /* 数字排版：span 占满整卡高度，flex 精确居中；百分比定位，所有浏览器一致 */
  .half span, .flap span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 200%;          /* 2 × 窗口高 = 整卡高 */
    top: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    line-height: 1;
  }
  .half.upper span, .flap.front span { top: 0; }     /* 显示字形上半 */
  .half.lower span, .flap.back span  { top: -100%; } /* 上移一整卡，显示字形下半 */

  /* 翻页动片：只在翻页动画进行的 ~500ms 内存在（goA/goB 类挂上才显示），
     待机时 display:none 完全不进合成树。
     这是 iPadOS 锁屏裁切的结构性修复：此前翻页片常驻合成层（opacity:0 + will-change），
     秒卡每秒刷新层内容，锁屏时 iOS 丢弃/损坏的正是这些最活跃的层瓦片，
     解锁后 Safari 误以为层内容没变而沿用坏瓦片 → 只有秒卡被裁。
     改为瞬态层后，任何损坏的层都会在 1 秒内随动画结束被销毁重建，无法存活。 */
  .flap {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    background: -webkit-linear-gradient(top, #303036 0%, #1e1e22 100%);
    background: linear-gradient(180deg, #303036 0%, #1e1e22 100%);
    display: none;
    pointer-events: none;   /* 保险：翻页过程中也绝不拦截点击 */
  }
  .card.goA .flap, .card.goB .flap {
    display: block;
    -webkit-will-change: transform;
    will-change: transform;
  }
  .flap.front {
    top: 0;
    z-index: 3;
    -webkit-transform-origin: 50% 100%;
    transform-origin: 50% 100%;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.9);
  }
  .flap.back {
    bottom: 0;
    z-index: 2;
    background: -webkit-linear-gradient(top, #232327 0%, #1a1a1e 100%);
    background: linear-gradient(180deg, #232327 0%, #1a1a1e 100%);
    box-shadow: inset 0 1px 0 rgba(0,0,0,0.9);
  }

  /*
    翻页动画（关键兼容性 + 省电决策）：
    - 不用 3D rotateX（iPadOS Safari 对 overflow:hidden + 3D 动画的渲染有怪癖），
      用 2D scaleY 压缩翻转：前片 1→0 压合，后片 0→1 展开
    - 总时长约 500ms（前片 0.25s + 后片 0.25s），翻页节奏与之前观感一致
    - A/B 两组同形 keyframes 交替播放：翻页时只换动画名即可重播，
      省掉每秒一次的强制 reflow（void offsetWidth）
  */
  .card.goA .flap.front {
    -webkit-transform-origin: 50% 100%;
    transform-origin: 50% 100%;
    -webkit-animation: flipTopA 0.25s ease-in both;
    animation: flipTopA 0.25s ease-in both;
  }
  .card.goA .flap.back {
    -webkit-transform-origin: 50% 0%;
    transform-origin: 50% 0%;
    -webkit-animation: flipBottomA 0.25s 0.25s ease-out both;
    animation: flipBottomA 0.25s 0.25s ease-out both;
  }
  .card.goB .flap.front {
    -webkit-transform-origin: 50% 100%;
    transform-origin: 50% 100%;
    -webkit-animation: flipTopB 0.25s ease-in both;
    animation: flipTopB 0.25s ease-in both;
  }
  .card.goB .flap.back {
    -webkit-transform-origin: 50% 0%;
    transform-origin: 50% 0%;
    -webkit-animation: flipBottomB 0.25s 0.25s ease-out both;
    animation: flipBottomB 0.25s 0.25s ease-out both;
  }
  @-webkit-keyframes flipTopA {
    from { -webkit-transform: scaleY(1); }
    to   { -webkit-transform: scaleY(0); }
  }
  @keyframes flipTopA {
    from { transform: scaleY(1); }
    to   { transform: scaleY(0); }
  }
  @-webkit-keyframes flipBottomA {
    from { -webkit-transform: scaleY(0); }
    to   { -webkit-transform: scaleY(1); }
  }
  @-webkit-keyframes flipBottomA {
    from { -webkit-transform: scaleY(0); }
    to   { -webkit-transform: scaleY(1); }
  }
  @keyframes flipBottomA {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }
  @-webkit-keyframes flipTopB {
    from { -webkit-transform: scaleY(1); }
    to   { -webkit-transform: scaleY(0); }
  }
  @keyframes flipTopB {
    from { transform: scaleY(1); }
    to   { transform: scaleY(0); }
  }
  @-webkit-keyframes flipBottomB {
    from { -webkit-transform: scaleY(0); }
    to   { -webkit-transform: scaleY(1); }
  }
  @keyframes flipBottomB {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }

  /* 左上角模式按钮条（刻意做得很淡，不干扰时钟本体；激活项略亮并显示"时钟"） */
  #modeBar {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
  }
  .mode-btn {
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: none;
    color: #fff;
    opacity: 0.22;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 12px 14px;
    margin: 0;
    margin-right: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-btn:last-child { margin-right: 0; }

  /* 番茄钟 / 倒计时视图：状态标签 + 翻页卡 + 操作提示，整体居中 */
  #pomoView,
  #cdView {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  #pomoState,
  #cdState,
  #swState {
    color: #fff;
    opacity: 0.4;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3em;
    margin-bottom: 26px;
  }
  #pomoHint,
  #cdHint,
  #swHint {
    color: #fff;
    opacity: 0.18;
    font-size: 13px;
    letter-spacing: 0.1em;
    margin-top: 26px;
  }

  /* AM / PM 角标（位置由 JS 按像素写入；padding+负 margin 扩大点击热区，视觉位置不变） */
  .meridiem {
    position: absolute;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.05em;
    z-index: 1;
    cursor: pointer;
    padding: 14px;
    margin: -14px;
  }

  /*
    正计时视图（省电设计）：
    - 未点计次：时分秒铺满整屏（与倒计时观感一致）
    - 点计次：主界面用 transform scale(0.75) 缩到 3/4（合成器动画，零重排），
      侧边栏 translateX 划入右侧 1/4（同样只动 transform，不触发 layout）
    - 动画只在展开/收起的 0.3s 内存在，待机时不进合成树
  */
  #swView {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  #swMain {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-transform-origin: left center;
    transform-origin: left center;
    -webkit-transition: -webkit-transform 0.3s ease;
    transition: transform 0.3s ease;
  }
  #swView.side #swMain {
    -webkit-transform: scale(0.75);
    transform: scale(0.75);
  }
  #swSide {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 25%;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    background: rgba(255,255,255,0.035);
    border-left: 1px solid rgba(255,255,255,0.07);
    -webkit-transform: translateX(103%);
    transform: translateX(103%);
    opacity: 0;
    pointer-events: none;   /* 收起状态下不可点击 */
    -webkit-transition: -webkit-transform 0.3s ease, opacity 0.3s ease;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  #swView.side #swSide {
    -webkit-transform: translateX(0);
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  #swSideHead {
    -webkit-flex: none;
    flex: none;
    color: #fff;
    opacity: 0.4;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    padding: 14px 14px 8px;
  }
  #swLaps {
    -webkit-flex: 1;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .lap-row {
    padding: 9px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .lap-idx {
    color: #fff;
    opacity: 0.3;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .lap-total {
    color: #fff;
    opacity: 0.85;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .lap-delta {
    color: #fff;
    opacity: 0.35;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  /* 计次悬浮按钮：右下角，风格与左上角模式按钮一致（很淡，不抢视觉） */
  #lapBtn {
    position: fixed;
    right: 16px;
    bottom: 20px;
    z-index: 30;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
    color: #fff;
    opacity: 0.45;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 10px 20px;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
</style>

      <div class="half lower" data-page-node-id="6RuJ24vPZBFoOiW9S1WdHZ"><span data-page-node-id="8AuGz0ECY6TbFAFy4zHeke">08</span></div>
      <div class="flap front" data-page-node-id="ZbqlB9Ir1GTWidfUkw5Ez9"><span data-page-node-id="QOoryGWaa0zpPeRoICwYVg"></span></div>
      <div class="flap back" data-page-node-id="5VoR5uJbraC9ULfJwjfH0a"><span data-page-node-id="uLg92pGzx3GugU9sekHD9R"></span></div>
    </div>
  </div>

  <div id="pomoView" style="display:none">
    <div id="pomoState">专注</div>
    <div class="clock" id="pomoCards">
      <div class="card" id="pMin">
        <div class="half upper"><span>25</span></div>
        <div class="half lower"><span>25</span></div>
        <div class="flap front"><span></span></div>
        <div class="flap back"><span></span></div>
      </div>
      <div class="card" id="pSec">
        <div class="half upper"><span>00</span></div>
        <div class="half lower"><span>00</span></div>
        <div class="flap front"><span></span></div>
        <div class="flap back"><span></span></div>
      </div>
    </div>
    <div id="pomoHint">轻点开始 / 暂停 · 双击重置</div>
  </div>

  <div id="cdView" style="display:none">
    <div id="cdState">倒计时</div>
    <div class="clock" id="cdCards">
      <div class="card" id="cH">
        <div class="half upper"><span>01</span></div>
        <div class="half lower"><span>01</span></div>
        <div class="flap front"><span></span></div>
        <div class="flap back"><span></span></div>
      </div>
      <div class="card" id="cM">
        <div class="half upper"><span>00</span></div>
        <div class="half lower"><span>00</span></div>
        <div class="flap front"><span></span></div>
        <div class="flap back"><span></span></div>
      </div>
      <div class="card" id="cS">
        <div class="half upper"><span>00</span></div>
        <div class="half lower"><span>00</span></div>
        <div class="flap front"><span></span></div>
        <div class="flap back"><span></span></div>
      </div>
    </div>
    <div id="cdHint">轻点开始 / 暂停 · 双击重置</div>
  </div>

  <!-- 正计时视图：左侧时分秒（点计次后缩放至 3/4），右侧 1/4 计次侧边栏，右下角悬浮计次按钮 -->
  <div id="swView" style="display:none">
    <div id="swMain">
      <div id="swState">正计时</div>
      <div class="clock" id="swCards">
        <div class="card" id="swH">
          <div class="half upper"><span>00</span></div>
          <div class="half lower"><span>00</span></div>
          <div class="flap front"><span></span></div>
          <div class="flap back"><span></span></div>
        </div>
        <div class="card" id="swM">
          <div class="half upper"><span>00</span></div>
          <div class="half lower"><span>00</span></div>
          <div class="flap front"><span></span></div>
          <div class="flap back"><span></span></div>
        </div>
        <div class="card" id="swS">
          <div class="half upper"><span>00</span></div>
          <div class="half lower"><span>00</span></div>
          <div class="flap front"><span></span></div>
          <div class="flap back"><span></span></div>
        </div>
      </div>
      <div id="swHint">轻点开始 / 暂停 · 双击重置</div>
    </div>
    <div id="swSide">
      <div id="swSideHead">计次</div>
      <div id="swLaps"></div>
    </div>
    <button id="lapBtn" type="button">计次</button>
  </div>

<script>
(function () {
  'use strict';

  var hourCard = document.getElementById('hourCard');
  var minuteCard = document.getElementById('minuteCard');
  var secondCard = document.getElementById('secondCard');
  var meridiem = document.getElementById('meridiem');

  /* 番茄钟视图元素 */
  var clockView = document.getElementById('clockView');
  var pomoView = document.getElementById('pomoView');
  var pomoCards = document.getElementById('pomoCards');
  var pMin = document.getElementById('pMin');
  var pSec = document.getElementById('pSec');
  var pomoState = document.getElementById('pomoState');

  /* 倒计时视图元素 + 左上角按钮条 */
  var cdView = document.getElementById('cdView');
  var cdCards = document.getElementById('cdCards');
  var cH = document.getElementById('cH');
  var cM = document.getElementById('cM');
  var cS = document.getElementById('cS');
  var cdState = document.getElementById('cdState');
  var pomoBtn = document.getElementById('pomoBtn');
  var h1Btn = document.getElementById('h1Btn');
  var h2Btn = document.getElementById('h2Btn');
  var swBtn = document.getElementById('swBtn');

  /* 正计时视图元素 */
  var swView = document.getElementById('swView');
  var swCards = document.getElementById('swCards');
  var swH = document.getElementById('swH');
  var swM = document.getElementById('swM');
  var swS = document.getElementById('swS');
  var swState = document.getElementById('swState');
  var swSideHead = document.getElementById('swSideHead');
  var swLaps = document.getElementById('swLaps');
  var lapBtn = document.getElementById('lapBtn');

  /* ---------- 布局：JS 按屏幕像素计算，写入内联样式（不依赖 calc/变量/vmin） ---------- */
  function applyCard(card, w, h, fs) {
    var r = (w * 0.075) + 'px';
    var s = card.style;
    s.width = w + 'px';
    s.height = h + 'px';
    s.fontSize = fs + 'px';
    var up = card.querySelector('.upper');
    var lo = card.querySelector('.lower');
    var fr = card.querySelector('.flap.front');
    var ba = card.querySelector('.flap.back');
    up.style.borderRadius = r + ' ' + r + ' 0 0';
    lo.style.borderRadius = '0 0 ' + r + ' ' + r;
    fr.style.borderRadius = r + ' ' + r + ' 0 0';
    ba.style.borderRadius = '0 0 ' + r + ' ' + r;
    var md = card.querySelector('.meridiem');
    if (md) {
      md.style.fontSize = (fs * 0.15) + 'px';
      md.style.left = (w * 0.05) + 'px';
      md.style.bottom = (h * 0.10) + 'px';
    }
  }

  function layout() {
    var w = document.documentElement.clientWidth;
    var h = document.documentElement.clientHeight;
    var GAP = 0.08;                  /* 卡间距 = 0.08 × 基准 */
    var LABEL = 26 + 16 + 26 + 13;   /* 番茄钟/倒计时视图的标签与提示占位 */
    var phoneLs = h < 500 && w > h;  /* 手机横屏 */

    /*
      尺寸策略：
      - iPad / 电脑（横竖屏）：保持原版尺寸 b = min(屏高 30%, 屏宽 24%)
      - 手机横屏：屏幕又矮又宽，按宽度 94% 撑满
        时钟视图 3 张卡共 3.56b、番茄钟 2.48b、倒计时 3.76b
    */
    var b, bp, bd;
    if (!phoneLs) {
      b = Math.min(h * 0.30, w * 0.24);
      bp = b;
      bd = Math.min(b, w / 4.0);
    } else {
      b = Math.min(w * 0.94 / 3.56, h * 0.86 / 1.4);
      bp = Math.min(w * 0.94 / 2.48, (h - LABEL) * 0.98 / 1.4);
      bd = Math.min(w * 0.94 / 3.76, (h - LABEL) * 0.98 / 1.4);
    }

    /* 时钟视图 */
    var bigW = b * 1.2, bigH = b * 1.4;
    var secW = b, secH = bigH * 0.5;
    minuteCard.style.marginLeft = (b * GAP) + 'px';
    secondCard.style.marginLeft = (b * GAP) + 'px';
    applyCard(hourCard, bigW, bigH, b * 0.75);
    applyCard(minuteCard, bigW, bigH, b * 0.75);
    applyCard(secondCard, secW, secH, secH * 0.54);

    /* 番茄钟视图 */
    var pW = bp * 1.2, pH = bp * 1.4;
    pSec.style.marginLeft = (bp * GAP) + 'px';
    applyCard(pMin, pW, pH, bp * 0.75);
    applyCard(pSec, pW, pH, bp * 0.75);

    /* 倒计时视图 */
    var cW = bd * 1.2, cHh = bd * 1.4;
    cM.style.marginLeft = (bd * GAP) + 'px';
    cS.style.marginLeft = (bd * GAP) + 'px';
    applyCard(cH, cW, cHh, bd * 0.75);
    applyCard(cM, cW, cHh, bd * 0.75);
    applyCard(cS, cW, cHh, bd * 0.75);

    /* 正计时视图（与倒计时同尺寸；点计次后的 3/4 缩放走 transform，不参与布局计算） */
    swM.style.marginLeft = (bd * GAP) + 'px';
    swS.style.marginLeft = (bd * GAP) + 'px';
    applyCard(swH, cW, cHh, bd * 0.75);
    applyCard(swM, cW, cHh, bd * 0.75);
    applyCard(swS, cW, cHh, bd * 0.75);
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 300); });

  /* ---------- 单卡翻页 ---------- */
  function setCard(card, val, animate) {
    var upper = card.querySelector('.upper span');
    var lower = card.querySelector('.lower span');
    var front = card.querySelector('.flap.front span');
    var back  = card.querySelector('.flap.back span');
    var old = card.getAttribute('data-v');

    /* 上一次翻页还没收尾（动画进行中又有新写入）：
       立即结算到翻页目标值，并清掉旧收尾定时器——
       否则两个定时器先后开火会把数字改来改去（暂停时跳变的根源） */
    if (card._flipT) {
      clearTimeout(card._flipT);
      card._flipT = 0;
      upper.textContent = back.textContent;   /* 翻页目标值（翻页开始时已写入） */
      lower.textContent = back.textContent;
      card.classList.remove('goA');
      card.classList.remove('goB');
      card.setAttribute('data-v', back.textContent);
      old = back.textContent;
    }

    if (old === val) { return; }   /* 值没变：不写任何 DOM，零渲染开销 */
    if (old === null || old === '' || !animate) {
      upper.textContent = val;
      lower.textContent = val;
      card.setAttribute('data-v', val);
      return;
    }
    front.textContent = old;   // 下翻的旧值
    back.textContent = val;    // 落下的新值
    upper.textContent = val;   // 上半静态片提前换新值（被前盖住）
    /* A/B 两组动画交替播放：换个类名浏览器就自动重播，无需强制 reflow */
    card._alt = !card._alt;
    var goCls = card._alt ? 'goA' : 'goB';
    card.classList.remove('goA');
    card.classList.remove('goB');
    card.classList.add(goCls);
    card._flipT = setTimeout(function () {
      card._flipT = 0;
      upper.textContent = val;
      lower.textContent = val;
      card.classList.remove(goCls);
      card.setAttribute('data-v', val);
    }, 540);
  }

  /* ---------- 12 / 24 小时制切换（点击 AM/PM 角标，localStorage 记住偏好） ---------- */
  var mode12 = true;
  try {
    if (localStorage.getItem('flipclock-hourmode') === '24') { mode12 = false; }
  } catch (e) { /* 隐私模式等场景下不可用，忽略 */ }

  meridiem.addEventListener('click', function () {
    mode12 = !mode12;
    try { localStorage.setItem('flipclock-hourmode', mode12 ? '12' : '24'); } catch (e) {}
    tick(true);   /* 小时卡会自动翻到新制式的数字 */
  });

  /* ---------- 番茄钟：25 分钟专注 / 5 分钟休息，时间戳走时（不受 setInterval 误差影响） ---------- */
  var FOCUS_MS = 25 * 60 * 1000;
  var BREAK_MS = 5 * 60 * 1000;
  var pomo = { mode: 'focus', running: false, endAt: 0, remain: FOCUS_MS };

  function pomoFull() { return pomo.mode === 'focus' ? FOCUS_MS : BREAK_MS; }

  function pomoRender(animate) {
    var remain = pomo.running ? Math.max(0, pomo.endAt - Date.now()) : pomo.remain;
    var totalSec = Math.ceil(remain / 1000);
    var mm = Math.floor(totalSec / 60);
    var ss = totalSec % 60;
    setCard(pMin, (mm < 10 ? '0' : '') + mm, animate);
    setCard(pSec, (ss < 10 ? '0' : '') + ss, animate);
    /* 走时中只显示段名保持简洁；暂停时追加「已暂停」提示，防止误以为没在走 */
    var st = (pomo.mode === 'focus' ? '专注' : '休息') + (pomo.running ? '' : ' · 已暂停');
    if (pomoState.textContent !== st) { pomoState.textContent = st; }   /* 没变就不写 DOM */
  }

  function pomoTick(animate) {
    if (!pomo.running) { return; }
    if (pomo.endAt - Date.now() <= 0) {
      /* 当前段走完：专注 <-> 休息自动交替，无缝继续 */
      pomo.mode = (pomo.mode === 'focus' ? 'break' : 'focus');
      pomo.endAt = Date.now() + pomoFull();
    }
    pomoRender(animate !== false);
  }

  function pomoReset() {
    pomo.running = false;
    pomo.remain = pomoFull();
    pomoRender(true);
  }

  /* ---------- 轻点 = 开始 / 暂停，双击 = 重置（单击/双击冲突的严谨解法） ----------
     旧实现的问题：第一击立即执行暂停/开始，第二击若落在 350ms 内才重置。两个缺陷：
     1) 双击的第一下永远会先闪一次「暂停-继续」，体验割裂（结构性问题）；
     2) iPadOS 对快速双击的第二下会延迟合成 click（系统要先判定手势），
        实测两下 click 的间隔经常超过 350ms，第二击被当成新的单击，
        重置因此彻底失灵。
     现在的方案（三层保障）：
     a) 用 touchend（真实手指离开时刻）做计时基准，绕开 iOS 的 click 合成延迟；
        桌面鼠标（无触摸）走 click 兜底；触摸后 800ms 内的衍生 ghost click 一律
        丢弃，防止触摸 + click 双触发；
     b) 单击动作不再立即执行，而是挂起 300ms：窗口内来了第二击 → 取消单击、
        只执行重置；窗口内没有第二击 → 才真正执行开始/暂停
        （暂停时剩余时间按当下时刻结算，一秒不丢）；
     c) 三击 = 单击 + 双击，行为可预期（例如：暂停后紧跟重置）。 */
  function bindTapControls(el, onSingle, onDouble) {
    var pendingTimer = null;   /* 双击判定窗口内挂起的单击动作 */
    var lastTouchEnd = 0;      /* 触摸时刻，用于丢弃 iOS 衍生的 ghost click */

    function onTap() {
      if (pendingTimer !== null) {
        /* 第二击落在窗口内：确认是双击，取消待执行的单击 */
        clearTimeout(pendingTimer);
        pendingTimer = null;
        onDouble();
      } else {
        pendingTimer = setTimeout(function () {
          pendingTimer = null;
          onSingle();
        }, 300);
      }
    }

    el.addEventListener('touchend', function (e) {
      if (e.changedTouches.length !== 1 || e.touches.length !== 0) { return; }
      lastTouchEnd = Date.now();
      onTap();
    });
    el.addEventListener('click', function () {
      if (Date.now() - lastTouchEnd < 800) { return; }   /* 触摸的衍生 click，已处理 */
      onTap();
    });
  }

  /* 番茄钟：轻点开始 / 暂停，双击重置 */
  bindTapControls(
    pomoCards,
    function () {
      if (pomo.running) {
        pomo.remain = Math.max(0, pomo.endAt - Date.now());
        pomo.running = false;
      } else {
        if (pomo.remain <= 0) { pomo.remain = pomoFull(); }
        pomo.endAt = Date.now() + pomo.remain;
        pomo.running = true;
      }
      pomoRender(true);
    },
    pomoReset
  );

  /* ---------- 一小时 / 两小时倒计时（到 0 停住，不循环） ---------- */
  var H1 = 60 * 60 * 1000;
  var H2 = 2 * 60 * 60 * 1000;
  var cd = { running: false, endAt: 0, remain: H1, total: H1 };

  function cdRender(animate) {
    var remain = cd.running ? Math.max(0, cd.endAt - Date.now()) : cd.remain;
    var totalSec = Math.ceil(remain / 1000);
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    setCard(cH, (hh < 10 ? '0' : '') + hh, animate);
    setCard(cM, (mm < 10 ? '0' : '') + mm, animate);
    setCard(cS, (ss < 10 ? '0' : '') + ss, animate);
    /* 走时中只显示「倒计时」保持简洁；暂停/结束状态在标题处轻提醒 */
    var st = '倒计时';
    if (!cd.running) { st = (cd.remain <= 0 ? '倒计时 · 已结束' : '倒计时 · 已暂停'); }
    if (cdState.textContent !== st) { cdState.textContent = st; }
  }

  function cdTick(animate) {
    if (!cd.running) { return; }
    if (cd.endAt - Date.now() <= 0) {
      cd.running = false;
      cd.remain = 0;
    }
    cdRender(animate !== false);
  }

  function cdStart(dur) {
    cd.total = dur;
    cd.remain = dur;
    cd.endAt = Date.now() + dur;
    cd.running = true;
  }

  /* 倒计时：轻点开始 / 暂停，双击重置（复用同一套单击/双击判定） */
  bindTapControls(
    cdCards,
    function () {
      if (cd.running) {
        cd.remain = Math.max(0, cd.endAt - Date.now());
        cd.running = false;
      } else {
        if (cd.remain <= 0) { cd.remain = cd.total; }
        cd.endAt = Date.now() + cd.remain;
        cd.running = true;
      }
      cdRender(true);
    },
    function () {
      cd.running = false;
      cd.remain = cd.total;
      cdRender(true);
    }
  );

  /* ---------- 正计时（秒表）+ 计次 ----------
     时间戳走时（Date.now 差值，零漂移）；计次列表只在点击时写一次 DOM；
     侧边栏展开用 transform 动画，待机时零渲染开销 */
  var SW_MAX_LAPS = 300;
  var sw = { running: false, startAt: 0, elapsed: 0, laps: [] };

  function swNow() {
    return sw.running ? (Date.now() - sw.startAt) : sw.elapsed;
  }

  function swRender(animate) {
    var totalSec = Math.floor(swNow() / 1000);
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    setCard(swH, (hh < 10 ? '0' : '') + hh, animate);
    setCard(swM, (mm < 10 ? '0' : '') + mm, animate);
    setCard(swS, (ss < 10 ? '0' : '') + ss, animate);
    /* 走时中只显示「正计时」；未开始不提示，暂停后才追加提示 */
    var st = '正计时';
    if (!sw.running && sw.elapsed > 0) { st = '正计时 · 已暂停'; }
    if (swState.textContent !== st) { swState.textContent = st; }
  }

  function swTick(animate) {
    if (!sw.running) { return; }
    swRender(animate !== false);
  }

  /* 计次记录格式：总时长 + 与上一次点击的间隔（首次间隔记 0） */
  function fmtDur(ms) {
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var ss = s % 60;
    var out = [];
    if (h > 0) { out.push(h + ' h'); }
    if (h > 0 || m > 0) { out.push(m + ' min'); }
    out.push(ss + ' 秒');
    return out.join(' ');
  }

  function updateLapHead() {
    var t = '计次';
    if (sw.laps.length > 0) { t += ' · ' + sw.laps.length + '/' + SW_MAX_LAPS; }
    if (swSideHead.textContent !== t) { swSideHead.textContent = t; }
  }

  function pushLap() {
    if (sw.laps.length >= SW_MAX_LAPS) { return; }   /* 上限 300 次 */
    var t = swNow();
    if (t <= 0) { return; }   /* 还没开始计时：不记录 */
    var prev = sw.laps.length ? sw.laps[sw.laps.length - 1].t : 0;
    var n = sw.laps.push({ t: t, d: t - prev });
    swView.classList.add('side');   /* 首次计次即展开侧边栏（已展开则保持） */
    /* 新记录插到最上面，最新的计次永远第一眼可见；每次点击只写一次 DOM */
    swLaps.insertAdjacentHTML('afterbegin',
      '<div class="lap-row">' +
        '<div class="lap-idx">#' + n + '</div>' +
        '<div class="lap-total">' + fmtDur(t) + '</div>' +
        '<div class="lap-delta">间隔 ' + fmtDur(t - prev) + '</div>' +
      '</div>');
    updateLapHead();
    if (sw.laps.length >= SW_MAX_LAPS) { lapBtn.style.opacity = '0.2'; }   /* 达上限后按钮变淡示意 */
  }

  lapBtn.addEventListener('click', pushLap);

  /* 正计时：轻点开始 / 暂停，双击重置（清计次 + 侧边栏收回 + 时分秒回全屏） */
  bindTapControls(
    swCards,
    function () {
      if (sw.running) {
        sw.elapsed = Date.now() - sw.startAt;
        sw.running = false;
      } else {
        sw.startAt = Date.now() - sw.elapsed;
        sw.running = true;
      }
      swRender(true);
    },
    function () {
      sw.running = false;
      sw.elapsed = 0;
      sw.laps.length = 0;
      swLaps.innerHTML = '';
      swView.classList.remove('side');
      lapBtn.style.opacity = '';
      updateLapHead();
      swRender(false);
    }
  );

  /* ---------- 视图切换（时钟 / 番茄钟 / 倒计时 / 正计时），互不干扰 ----------
     点非激活按钮 = 进入对应模式；点当前激活的按钮 = 回到时钟 */
  var currentView = 'clock';

  function showView(v) {
    currentView = v;
    clockView.style.display = v === 'clock' ? 'flex' : 'none';
    pomoView.style.display = v === 'pomo' ? 'flex' : 'none';
    cdView.style.display = v === 'countdown' ? 'flex' : 'none';
    swView.style.display = v === 'stopwatch' ? 'block' : 'none';

    var cdOn1 = v === 'countdown' && cd.total === H1;
    var cdOn2 = v === 'countdown' && cd.total === H2;
    var swOn = v === 'stopwatch';
    pomoBtn.textContent = v === 'pomo' ? '时钟' : '番茄钟';
    h1Btn.textContent = cdOn1 ? '时钟' : '一小时';
    h2Btn.textContent = cdOn2 ? '时钟' : '两小时';
    swBtn.textContent = swOn ? '时钟' : '正计时';
    /* 激活项略亮，其余保持很淡 */
    pomoBtn.style.opacity = v === 'pomo' ? '0.5' : '';
    h1Btn.style.opacity = cdOn1 ? '0.5' : '';
    h2Btn.style.opacity = cdOn2 ? '0.5' : '';
    swBtn.style.opacity = swOn ? '0.5' : '';

    if (v === 'pomo') { pomoRender(true); }
    if (v === 'countdown') { cdRender(true); }
    if (swOn) { swRender(true); }
  }

  pomoBtn.addEventListener('click', function () {
    showView(currentView === 'pomo' ? 'clock' : 'pomo');
  });
  h1Btn.addEventListener('click', function () {
    if (currentView === 'countdown' && cd.total === H1) { showView('clock'); return; }
    cdStart(H1);
    showView('countdown');
  });
  h2Btn.addEventListener('click', function () {
    if (currentView === 'countdown' && cd.total === H2) { showView('clock'); return; }
    cdStart(H2);
    showView('countdown');
  });
  swBtn.addEventListener('click', function () {
    showView(currentView === 'stopwatch' ? 'clock' : 'stopwatch');
  });

  /* ---------- 时间维护：直接读系统时间（Date.now() 即本地时间，零漂移） ---------- */
  function tick(animate) {
    var d = new Date();
    var h24 = d.getHours();
    var h12 = h24 % 12;
    if (h12 === 0) { h12 = 12; }
    var mm = d.getMinutes();
    var ss = d.getSeconds();
    var mStr = (mm < 10 ? '0' : '') + mm;
    var sStr = (ss < 10 ? '0' : '') + ss;

    var md = mode12 ? (h24 < 12 ? 'AM' : 'PM') : '24H';
    if (meridiem.textContent !== md) { meridiem.textContent = md; }   /* 没变就不写 DOM */
    setCard(hourCard, mode12 ? String(h12) : ((h24 < 10 ? '0' : '') + h24), animate);
    setCard(minuteCard, mStr, animate);
    setCard(secondCard, sStr, animate);
  }

  /* ---------- 主循环（极致省电） ----------
     1. 不用固定 setInterval：改为对齐真实秒边界的 setTimeout 链，
        每次唤醒都落在秒变化的瞬间，绝不空转，数字永远及时
     2. 页面隐藏（熄屏/切后台）时彻底清除定时器，JS 完全休眠；
        回到前台再重启，时间照读系统时钟，天然准确
     3. 只有当前视图的计时体做带动画渲染，隐藏视图静默更新 */
  var mainTimer = null;
  var lastLoopAt = Date.now();

  function loopTick() {
    /* 挂起看门狗：主屏幕模式下锁屏/解锁可能不触发 visibilitychange，
       但系统挂起 JS 后定时器必然迟到——实际间隔超过 3 秒即视为经历了一次挂起，
       无论事件是否送达都强制全量重绘，保证裁切修复零漏网 */
    var now = Date.now();
    if (now - lastLoopAt > 3000) { repaintKick(); }
    lastLoopAt = now;

    tick(currentView === 'clock');
    pomoTick(currentView === 'pomo');
    cdTick(currentView === 'countdown');
    swTick(currentView === 'stopwatch');
    mainTimer = setTimeout(loopTick, 1020 - (Date.now() % 1000));
  }

  function startLoop() {
    if (mainTimer === null) { lastLoopAt = Date.now(); mainTimer = setTimeout(loopTick, 20); }
  }

  function stopLoop() {
    if (mainTimer !== null) { clearTimeout(mainTimer); mainTimer = null; }
  }

  /* ---------- 锁屏回前台的重绘修复 ----------
     iPadOS Safari 锁屏时会丢弃卡片的合成层瓦片，回来后拿旧瓦片凑合显示，
     卡片局部（如秒卡右侧）被裁切；旋转屏幕能恢复正是因为触发了重排重绘。
     实测轻量踢法（translateZ(0)）对已存在的合成层是空操作，Safari 不会重建瓦片。
     所以这里用两段式强制重绘：
     第一段：body display:none -> 强制 reflow -> 恢复，整个渲染树拆除重建，
             这是 iOS 上唯一保证全量重绘的方式（刚好从锁屏回来，一帧黑屏无感知）；
     第二段：400ms 后对卡片和翻页片做「销毁合成层再重建」兜底 Safari 的延迟重建。 */
  function repaintKick() {
    var b = document.body;
    b.style.display = 'none';
    void b.offsetHeight;          /* 强制同步 reflow，渲染树整体重建 */
    b.style.display = '';

    setTimeout(function () {
      var ids = ['hourCard', 'minuteCard', 'secondCard', 'pMin', 'pSec', 'cH', 'cM', 'cS', 'swH', 'swM', 'swS'];
      var els = [document.body];
      for (var i = 0; i < ids.length; i++) {
        var card = document.getElementById(ids[i]);
        if (!card) { continue; }
        els.push(card);
        var flaps = card.querySelectorAll('.flap');
        for (var j = 0; j < flaps.length; j++) { els.push(flaps[j]); }
      }
      for (var k = 0; k < els.length; k++) {
        els[k].style.webkitTransform = 'translateZ(0)';
        els[k].style.transform = 'translateZ(0)';
      }
      setTimeout(function () {
        for (var k2 = 0; k2 < els.length; k2++) {
          els[k2].style.webkitTransform = '';
          els[k2].style.transform = '';
        }
      }, 80);
    }, 400);
  }

  /* ---------- 屏幕常亮（三层策略，按系统自动降级，全部零可见痕迹） ----------
     A) iPadOS 16.4+：官方 Wake Lock API 申请屏幕常亮，零额外开销；
        系统会在切后台时自动释放，回前台重新申请
     B) 老系统兜底：每 10 分钟播放一次 1.5 秒的无声小视频（1.6KB 内嵌）。
        iOS 的息屏倒计时会在媒体播放结束时重新计时——
        每 10 分钟"续一口气"，30 分钟的倒计时永远走不到头 → 永不息屏，
        比持续播放省电得多（视频解码时间仅占 0.25%）
     C) 以上都不生效时：请到 设置-显示与亮度-自动锁定 选择最长档位配合 */
  var WAKE_VIDEO = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAANcbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAABdwAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAod0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAABdwAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAXcAAAAAAABAAAAAAH/bWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAoAAAAPABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABqm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAWpzdGJsAAAAtnN0c2QAAAAAAAAAAQAAAKZhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABFUxhdmM2MS4xOS4xMDAgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAALGF2Y0MBQsAK/+EAFWdCwAraewEQAAADABAAAAMBQPEiagEABGjOD8gAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAAPagAAD2oAAAAYc3R0cwAAAAAAAAABAAAADwAABAAAAAAUc3RzcwAAAAAAAAABAAAAAQAAABxzdHNjAAAAAAAAAAEAAAABAAAADwAAAAEAAABQc3RzegAAAAAAAAAAAAAADwAAAmYAAAAJAAAACQAAAAkAAAAJAAAACQAAAAkAAAAJAAAACQAAAAkAAAAJAAAACQAAAAkAAAAJAAAACQAAABRzdGNvAAAAAAAAAAEAAAOMAAAAYXVkdGEAAABZbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAsaWxzdAAAACSpdG9vAAAAHGRhdGEAAAABAAAAAExhdmY2MS43LjEwMAAAAAhmcmVlAAAC7G1kYXQAAAJUBgX//1DcRem95tlIt5Ys2CDZI+7veDI2NCAtIGNvcmUgMTY0IHIzMTkwIDdlZDc1M2IgLSBILjI2NC9NUEVHLTQgQVZDIGNvZGVjIC0gQ29weWxlZnQgMjAwMy0yMDI0IC0gaHR0cDovL3d3dy52aWRlb2xhbi5vcmcveDI2NC5odG1sIC0gb3B0aW9uczogY2FiYWM9MCByZWY9MSBkZWJsb2NrPTA6MDowIGFuYWx5c2U9MDowIG1lPWRpYSBzdWJtZT0wIHBzeT0xIHBzeV9yZD0xLjAwOjAuMDAgbWl4ZWRfcmVmPTAgbWVfcmFuZ2U9MTYgY2hyb21hX21lPTEgdHJlbGxpcz0wIDh4OGRjdD0wIGNxbT0wIGRlYWR6b25lPTIxLDExIGZhc3RfcHNraXA9MSBjaHJvbWFfcXBfb2Zmc2V0PTAgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTEwIHNjZW5lY3V0PTAgaW50cmFfcmVmcmVzaD0wIHJjPWNyZiBtYnRyZWU9MCBjcmY9MjMuMCBxY29tcD0wLjYwIHFwbWluPTAgcXBtYXg9NjkgcXBzdGVwPTQgaXBfcmF0aW89MS40MCBhcT0wAIAAAAAKZYiEOiYoAAkC4AAAAAVBmiAylAAAAAVBmkA2lAAAAAVBmmA2lAAAAAVBmoA2lAAAAAVBmqA2lAAAAAVBmsA6lAAAAAVBmuA6lAAAAAVBmwA6lAAAAAVBmyA6lAAAAAVBm0A6lAAAAAVBm2A6lAAAAAVBm4A6lAAAAAVBm6A6lAAAAAVBm8A6lA==';
  var wakeVideo = document.createElement('video');
  wakeVideo.muted = true;
  wakeVideo.setAttribute('playsinline', '');
  wakeVideo.setAttribute('webkit-playsinline', '');
  wakeVideo.setAttribute('preload', 'auto');
  wakeVideo.style.cssText = 'position:fixed;left:0;bottom:0;width:16px;height:16px;opacity:0.001;pointer-events:none;z-index:-1;';
  wakeVideo.src = WAKE_VIDEO;
  document.body.appendChild(wakeVideo);

  function videoPulse() {
    if (document.hidden) { return; }
    try {
      wakeVideo.currentTime = 0;
      var p = wakeVideo.play();
      if (p && p.catch) { p.catch(function () {}); }   /* 不支持时静默降级 */
      setTimeout(function () { try { wakeVideo.pause(); } catch (e) {} }, 1500);
    } catch (e) { /* 同上 */ }
  }

  var wakeLockObj = null;
  function requestWakeLock() {
    if (!navigator.wakeLock || document.hidden || wakeLockObj) { return; }
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLockObj = l;
      if (l.addEventListener) {
        l.addEventListener('release', function () { wakeLockObj = null; });
      }
    }).catch(function () {});
  }

  setInterval(videoPulse, 10 * 60 * 1000);   /* 每 10 分钟续一次息屏倒计时 */

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stopLoop();
    } else {
      startLoop();
      repaintKick();      /* 修复锁屏回来卡片局部被裁切 */
      requestWakeLock();  /* 回前台重新申请 Wake Lock */
      videoPulse();       /* 顺手把息屏倒计时也续上 */
    }
  });
  window.addEventListener('pageshow', repaintKick);   /* 从后台整页恢复时同样踢一脚 */
  startLoop();

  /* 初始化（首帧直接就位，不翻页） */
  tick(false);
  pomoRender(false);
  cdRender(false);
  swRender(false);

  /* 轻点屏幕尝试进入全屏（iPadOS 16.4+ 有效；iPadOS 14 Safari 不支持元素全屏，
     请用「添加到主屏幕」方式获得全屏，见 meta 配置） */
  document.addEventListener('click', function () {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn && !document.fullscreenElement && !document.webkitFullscreenElement) {
      try { fn.call(el); } catch (e) { /* iPadOS 14 上静默失败即可 */ }
    }
  });

  /* 屏蔽 iOS 的滚动回弹（双击缩放已由 CSS touch-action: manipulation 禁用；
     注意不要在 touchend 上 preventDefault——iOS 会因此吞掉第二次轻点的 click，
     导致番茄钟「双击重置」失效；
     唯一例外：计次侧边栏列表允许原生上下滚动，其他区域仍全部拦截） */
  document.addEventListener('touchmove', function (e) {
    if (swLaps && swLaps.contains(e.target)) { return; }
    e.preventDefault();
  }, { passive: false });
})();
</script>
